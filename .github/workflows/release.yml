name: Release

## Every push to main runs changesets/action. While there are pending changesets
## (.changeset/*.md), it opens or updates the release PR, which bumps
## package.json and writes CHANGELOG.md. Merging that PR pushes to main again with
## no pending changesets, and the action then publishes @vocdoni/skills to npm and
## creates a GitHub release and tag for it.
##
## Publishing runs `npm run release`: .github/scripts/check-release.mjs (plugin.json
## agrees with marketplace.json, every SKILL.md has a valid name and description),
## then `changeset publish`. A version already on npm is skipped, so re-runs are safe.
##
## Pre-releases: `npx changeset pre enter next` on a branch, merged to main, makes the
## next versions 0.2.0-next.N. They publish to the `next` dist-tag, so `npx
## @vocdoni/skills` keeps resolving to the latest stable. `changeset pre exit` ends it.
##
## npm uses trusted publishing (OIDC), so there is no npm token. The npm trusted
## publisher for @vocdoni/skills must point to this file: release.yml.
##
## Until the one-time bootstrap (manual first publish + trusted publisher, see
## CONTRIBUTING.md) is done, runs on main with no pending changesets fail at publish.

on:
  push:
    branches:
      - main

permissions:
  contents: read

## A publish must never be cancelled halfway; later pushes wait their turn.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        ## push the release commit and tags
      pull-requests: write   ## open or update the release PR
      id-token: write        ## required for npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      ## Trusted publishing needs npm >= 11.5.1 and node >= 22.14.0
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Preview the package contents
        run: npm pack --dry-run

      ## Without pending changesets this runs `npm run release`; with them it only
      ## versions the repo and updates the release PR.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: true
          ## Single package: no plural "Version Packages" default
          commit-message: "chore(release): version @vocdoni/skills"
          pr-title: "chore(release): version @vocdoni/skills"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          if [[ "$JOB_STATUS" != "success" ]]; then
            echo "Error: the release job failed. See the job log." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISHED" == "true" ]]; then
            echo "Published to npm:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- \(.name)@\(.version): https://www.npmjs.com/package/\(.name)/v/\(.version)"' <<< "$PUBLISHED_PACKAGES" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$PR_NUMBER" ]]; then
            echo "Release PR: #$PR_NUMBER. Merge it to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi
